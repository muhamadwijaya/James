[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm3tool"
version = "0.1.0"
description = "Wrapper Proxmark3 untuk membaca RFID, menampilkan data, dan memulihkan key MIFARE pada kartu sendiri."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pm3tool = "pm3tool.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pm3tool"]
